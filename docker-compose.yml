services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todos-backend
    expose:
      - "555"
    ports:
      - "555:555"
    env_file:
      - backend/.env
    environment:
      DB_NAME: ${DB_NAME:-multi-service-application}
      MONGODB_USERNAME_FILE: /run/secrets/mongo_root_username
      MONGODB_PASSWORD_FILE: /run/secrets/mongo_root_password
    secrets:
      - mongo_root_username
      - mongo_root_password
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://127.0.0.1:555/', 
        r => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1))
        .on('error',  () => process.exit(1))"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - todos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todos-frontend
    expose:
      - "80"
    env_file:
      - frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - todos-network

  nginx:
    image: nginx:alpine
    container_name: todos-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - todos-network

  redis:
    image: redis:7-alpine
    container_name: todos-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - todos-network

  mongodb:
    image: mongo:7
    container_name: todos-db
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    secrets:
      - mongo_root_username
      - mongo_root_password
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >
        - mongosh --quiet
          --username "$${cat /run/secrets/mongo_root_username}"
          --password "$${cat /run/secrets/mongo_root_password}"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok"
          | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - todos-network

volumes:
  mongo_data:
  redis_data:

networks:
  todos-network:
    name: todos-network
    driver: bridge

secrets:
  mongo_root_username:
    file: ./secrets/mongo_root_username.txt
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt